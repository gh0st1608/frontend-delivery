version: 0.2

# Solo compila la versión web y la deja como artefacto en dist/.
# El despliegue (bucket S3 + CloudFront) se agregará cuando exista la
# infraestructura del frontend en AWS.

phases:
  install:
    runtime-versions:
      # React Native 0.81 / Metro requieren Node >= 20.19.4
      nodejs: 20
    commands:
      - npm ci

  build:
    commands:
      - npx expo export --platform web

artifacts:
  base-directory: dist
  files:
    - "**/*"
